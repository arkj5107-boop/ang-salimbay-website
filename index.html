<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f4f4f4;
    color:#222;
    font-family:Arial, Helvetica, sans-serif;
}


/* =====================================================
   LOADING SCREEN
===================================================== */

#loadingScreen{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    background:#ffffff;

    display:flex;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    overflow:hidden;

    z-index:999999;

    opacity:1;
    visibility:visible;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#loadingScreen.hide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}


/* =====================================================
   LOADING SCENE
===================================================== */

.school-scene{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#ffffff;
}


/* =====================================================
   SUN
===================================================== */

.sun{

    position:absolute;

    left:50%;
    top:27%;

    width:125px;
    height:125px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffe989 0%,
            #ffd13b 35%,
            #f6ae00 75%,
            #ed9700 100%
        );

    box-shadow:
        0 0 20px rgba(251,189,25,.25),
        0 0 45px rgba(251,189,25,.18);

    transform:
        translate(-50%,55px)
        scale(.55);

    opacity:0;

    z-index:2;

    animation:
        sunRise 1.25s
        cubic-bezier(.2,.8,.2,1)
        .15s
        forwards;
}

@keyframes sunRise{

    0%{

        opacity:0;

        transform:
            translate(-50%,55px)
            scale(.55);

    }

    70%{

        opacity:1;

        transform:
            translate(-50%,-5px)
            scale(1.04);

    }

    100%{

        opacity:1;

        transform:
            translate(-50%,0)
            scale(1);

    }

}


/* =====================================================
   SUN RAYS
===================================================== */

.sun-rays{

    position:absolute;

    left:50%;
    top:27%;

    width:300px;
    height:300px;

    transform:
        translate(-50%,-50%);

    z-index:1;

    opacity:0;

    animation:
        raysAppear
        1s
        ease
        .35s
        forwards;
}


/* individual rays */

.sun-rays span{

    position:absolute;

    left:50%;
    top:50%;

    width:8px;
    height:42px;

    margin-left:-4px;
    margin-top:-21px;

    border-radius:999px;

    background:
        linear-gradient(
            to bottom,
            #ffe47a,
            #fbbd19
        );

    box-shadow:
        0 0 8px rgba(251,189,25,.25);

    transform-origin:
        center 150px;

    animation:
        rayPulse
        1.8s
        ease-in-out
        infinite;

}


/* 12 rays */

.sun-rays span:nth-child(1){
    transform:rotate(0deg) translateY(-108px);
    animation-delay:0s;
}

.sun-rays span:nth-child(2){
    transform:rotate(30deg) translateY(-108px);
    animation-delay:.12s;
}

.sun-rays span:nth-child(3){
    transform:rotate(60deg) translateY(-108px);
    animation-delay:.24s;
}

.sun-rays span:nth-child(4){
    transform:rotate(90deg) translateY(-108px);
    animation-delay:.36s;
}

.sun-rays span:nth-child(5){
    transform:rotate(120deg) translateY(-108px);
    animation-delay:.48s;
}

.sun-rays span:nth-child(6){
    transform:rotate(150deg) translateY(-108px);
    animation-delay:.60s;
}

.sun-rays span:nth-child(7){
    transform:rotate(180deg) translateY(-108px);
    animation-delay:.72s;
}

.sun-rays span:nth-child(8){
    transform:rotate(210deg) translateY(-108px);
    animation-delay:.84s;
}

.sun-rays span:nth-child(9){
    transform:rotate(240deg) translateY(-108px);
    animation-delay:.96s;
}

.sun-rays span:nth-child(10){
    transform:rotate(270deg) translateY(-108px);
    animation-delay:1.08s;
}

.sun-rays span:nth-child(11){
    transform:rotate(300deg) translateY(-108px);
    animation-delay:1.20s;
}

.sun-rays span:nth-child(12){
    transform:rotate(330deg) translateY(-108px);
    animation-delay:1.32s;
}


/* ray entrance */

@keyframes raysAppear{

    0%{

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.65);

    }

    100%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);

    }

}


/* ray breathing animation */

@keyframes rayPulse{

    0%,
    100%{

        opacity:.55;

        filter:
            brightness(.95);

    }

    50%{

        opacity:1;

        filter:
            brightness(1.18);

    }

}


/* =====================================================
   GREEN LAND
===================================================== */

.hill{

    position:absolute;

    left:-12.5%;
    top:39%;

    width:125%;
    height:190px;

    background:
        linear-gradient(
            to bottom,
            #62c933,
            #48ae22
        );

    border-radius:
        50% 50% 0 0;

    transform:
        translateY(100px);

    opacity:0;

    z-index:3;

    animation:
        hillAppear
        1.1s
        ease
        .55s
        forwards;
}

@keyframes hillAppear{

    from{

        opacity:0;

        transform:
            translateY(100px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* =====================================================
   SCHOOL GROUND
===================================================== */

.school-ground{

    position:absolute;

    bottom:0;
    left:0;

    width:100%;
    height:43%;

    display:flex;

    overflow:hidden;

    z-index:4;
}

.school-blue{

    width:50%;
    height:100%;

    background:
        linear-gradient(
            135deg,
            #0868d0,
            #064da4
        );

    transform:
        translateX(-100%);

    animation:
        blueEnter
        1s
        cubic-bezier(.2,.8,.2,1)
        .7s
        forwards;
}

.school-red{

    width:50%;
    height:100%;

    background:
        linear-gradient(
            135deg,
            #e01c34,
            #b80d22
        );

    transform:
        translateX(100%);

    animation:
        redEnter
        1s
        cubic-bezier(.2,.8,.2,1)
        .7s
        forwards;
}

@keyframes blueEnter{

    to{

        transform:
            translateX(0);

    }

}

@keyframes redEnter{

    to{

        transform:
            translateX(0);

    }

}


/* =====================================================
   OPEN BOOK
===================================================== */

.book{

    position:absolute;

    left:50%;
    top:49%;

    width:190px;
    height:95px;

    transform:
        translate(-50%,35px)
        scale(.5);

    opacity:0;

    z-index:7;

    animation:
        bookAppear
        1s
        cubic-bezier(.2,.8,.2,1)
        1s
        forwards;
}

.book-left,
.book-right{

    position:absolute;

    top:0;

    width:50%;
    height:100%;

    background:#ffffff;

    box-shadow:
        0 5px 14px rgba(0,0,0,.18);
}

.book-left{

    left:0;

    border-radius:
        12px 2px 2px 12px;

    transform:
        skewY(5deg);
}

.book-right{

    right:0;

    border-radius:
        2px 12px 12px 2px;

    transform:
        skewY(-5deg);
}


/* book center */

.book-center{

    position:absolute;

    left:50%;
    top:3px;

    width:5px;
    height:90px;

    background:#dddddd;

    transform:
        translateX(-50%);

    z-index:3;
}


/* book lines */

.book-left::after,
.book-right::after{

    content:"";

    position:absolute;

    top:27px;

    width:55px;
    height:4px;

    background:#d7d7d7;

    border-radius:5px;

    box-shadow:
        0 13px 0 #d7d7d7,
        0 26px 0 #d7d7d7;
}

.book-left::after{
    right:18px;
}

.book-right::after{
    left:18px;
}

@keyframes bookAppear{

    0%{

        opacity:0;

        transform:
            translate(-50%,35px)
            scale(.5);

    }

    70%{

        opacity:1;

        transform:
            translate(-50%,-7px)
            scale(1.06);

    }

    100%{

        opacity:1;

        transform:
            translate(-50%,-10px)
            scale(1);

    }

}


/* =====================================================
   TORCH
===================================================== */

.torch{

    position:absolute;

    left:50%;
    top:58%;

    transform:
        translateX(-50%)
        translateY(30px)
        scale(.5);

    opacity:0;

    z-index:8;

    animation:
        torchAppear
        .8s
        ease
        1.3s
        forwards;
}

.torch-body{

    width:25px;
    height:110px;

    background:
        linear-gradient(
            90deg,
            #111111,
            #5d5d5d,
            #111111
        );

    border-radius:3px;
}

.torch-top{

    position:absolute;

    top:-15px;
    left:-15px;

    width:55px;
    height:20px;

    background:#111111;

    border-radius:
        50% 50% 5px 5px;
}


/* =====================================================
   FLAME
===================================================== */

.flame{

    position:absolute;

    left:50%;
    top:-60px;

    width:28px;
    height:48px;

    background:
        linear-gradient(
            135deg,
            #ffd400,
            #ff8c00
        );

    border-radius:
        50% 50% 50% 50%;

    transform:
        translateX(-50%)
        rotate(45deg);

    animation:
        flame
        .55s
        ease-in-out
        infinite
        alternate;
}

.flame::after{

    content:"";

    position:absolute;

    left:7px;
    top:15px;

    width:13px;
    height:25px;

    background:#fff3a3;

    border-radius:50%;
}

@keyframes flame{

    from{

        transform:
            translateX(-50%)
            rotate(40deg)
            scale(.9);

    }

    to{

        transform:
            translateX(-50%)
            rotate(50deg)
            scale(1.08);

    }

}

@keyframes torchAppear{

    from{

        opacity:0;

        transform:
            translateX(-50%)
            translateY(30px)
            scale(.5);

    }

    to{

        opacity:1;

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   WAVES
===================================================== */

.wave-container{

    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:100px;

    overflow:hidden;

    z-index:10;
}

.wave{

    position:absolute;

    left:-10%;

    width:120%;
    height:95px;

    background:#24b8dc;

    border-radius:
        50% 50% 0 0;

    animation:
        waveMove
        4s
        ease-in-out
        infinite;
}

.wave:nth-child(1){

    bottom:-50px;

}

.wave:nth-child(2){

    bottom:-70px;

    background:#0874c9;

    animation-delay:-2s;

}

@keyframes waveMove{

    0%,
    100%{

        transform:
            translateX(-2%)
            rotate(1deg);

    }

    50%{

        transform:
            translateX(2%)
            rotate(-1deg);

    }

}


/* =====================================================
   LOADING LOGO
===================================================== */

.loading-logo{

    position:relative;

    z-index:20;

    width:180px;

    max-width:60vw;

    opacity:0;

    transform:

@keyframes salimbayLogo{

    0%{

        opacity:0;

        transform:

    }

        transform:

        opacity:1;

    }

}


/* =====================================================
   LOADING TEXT
===================================================== */

.loading-text{

    position:relative;

    z-index:20;

    margin-top:18px;

    color:#6B0015;

    font-size:14px;

@keyframes textAppear{

    from{

        opacity:1;

        transform:

    }

}


/* =====================================================
   LOADING DOTS
===================================================== */

.loading-dots{

    position:relative;

    z-index:20;

    margin-top:10px;

    color:#6B0015;

    font-size:18px;

    letter-spacing:6px;

    min-height:22px;
}

.loading-dots::after{

    content:"";

    animation:
        loadingDots

        steps(4,end)
        infinite;
}

@keyframes loadingDots{

    0%{
        content:"";
    }

    25%{
        content:".";
    }

    50%{
        content:"..";
    }

    75%{
        content:"...";
    }

    100%{
        content:"";
    }

}

<script src="articles.js"></script>



<script>

/* =====================================================
   LOADING SCREEN
===================================================== */

(function(){

    const loadingScreen =
        document.getElementById("loadingScreen");


    function hideLoading(){

        if(!loadingScreen){
            return;
        }


        loadingScreen.classList.add("hide");


        setTimeout(function(){

            loadingScreen.style.display = "none";

        }, 900);

    }


    /*
       Normal loading
    */

    window.addEventListener(
        "load",
        function(){

            setTimeout(
                hideLoading,
                1900
            );

        }
    );


    /*
       Safety fallback.
       Kahit magkaroon ng problema sa ibang
       JavaScript, hindi mananatiling nakaharang
       ang loading screen.
    */

    setTimeout(
        hideLoading,
        5000
    );

})();



/* =====================================================
   SEARCH SYSTEM
===================================================== */

(function(){


    const grid =
        document.getElementById(
            "articleGrid"
        );


    const input =
        document.getElementById(
            "searchInput"
        );


    const resultsBox =
        document.getElementById(
            "searchResults"
        );


    const info =
        document.getElementById(
            "searchInfo"
        );


    /* =================================================
       CHECK ELEMENTS
    ================================================= */

    if(
        !grid ||
        !input ||
        !resultsBox ||
        !info
    ){

        console.error(
            "Ang search elements ay hindi nakita."
        );

        return;

    }


    /* =================================================
       CHECK ARTICLES.JS
    ================================================= */

    if(
        typeof articles === "undefined" ||
        !Array.isArray(articles)
    ){

        console.error(
            "Hindi na-load ang articles.js."
        );


        grid.innerHTML = `

            <div class="empty">

                <h3>
                    Hindi ma-load ang mga artikulo.
                </h3>

                <p style="margin-top:10px;">

                    Pakisigurong ang
                    <strong>articles.js</strong>
                    ay nasa parehong folder ng
                    <strong>index.html</strong>.

                </p>

            </div>

        `;

        return;

    }



    /* =================================================
       SECURITY / HTML ESCAPE
    ================================================= */

    function esc(value){

        return String(
            value ?? ""
        )

        .replace(
            /[&<>"']/g,
            function(match){

                const map = {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"

                };

                return map[match];

            }
        );

    }



    /* =================================================
       CONTRIBUTORS
    ================================================= */

    function people(article){

        const p = [];


        if(article.author){

            p.push(
                "✍️ " +
                article.author
            );

        }


        if(article.photographer){

            p.push(
                "📷 " +
                article.photographer
            );

        }


        if(article.illustrator){

            p.push(
                "🎨 " +
                article.illustrator
            );

        }


        if(article.editor){

            p.push(
                "🖊️ " +
                article.editor
            );

        }


        if(article.otherCredit){

            p.push(
                "👤 " +
                article.otherCredit
            );

        }


        /*
           Support din ang credits field
           ng Pax Silica article.
        */

        if(
            article.credits &&
            p.length === 0
        ){

            p.push(
                article.credits
            );

        }


        return p.join(" • ");

    }



    /* =================================================
       DISPLAY ARTICLES
    ================================================= */

    function displayArticles(list){

        grid.innerHTML = "";


        if(
            !Array.isArray(list) ||
            list.length === 0
        ){

            grid.innerHTML = `

                <div class="empty">

                    <h3>
                        Walang nahanap na artikulo.
                    </h3>

                    <p style="margin-top:10px;">

                        Subukan ang ibang salita,
                        pangalan, petsa, o paksa.

                    </p>

                </div>

            `;

            return;

        }


        list.forEach(
            function(article){

                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "card";


                const contributors =
                    people(article);


                let imageHTML = "";


                /*
                   Kung may image:
                   ipakita ang image.
                   
                   Kung walang image:
                   walang broken-image icon.
                */

                if(article.image){

                    imageHTML = `

                        <img
                            src="${esc(article.image)}"
                            alt="${esc(article.title)}"
                            loading="lazy"
                            onerror="
                                this.style.display='none';
                            "
                        >

                    `;

                }


                card.innerHTML = `

                    ${imageHTML}


                    <div class="card-content">


                        <h3>
                            ${esc(article.title)}
                        </h3>


                        <p>
                            ${esc(article.description)}
                        </p>


                        <p class="meta">

                            ${esc(
                                article.category || ""
                            )}

                            ${
                                article.category &&
                                article.date
                                ? " • "
                                : ""
                            }

                            ${esc(
                                article.date || ""
                            )}

                        </p>


                        ${
                            contributors

                            ?

                            `

                            <p class="meta">

                                ${esc(
                                    contributors
                                )}

                            </p>

                            `

                            :

                            ""

                        }


                        ${
                            article.url

                            ?

                            `

                            <a
                                href="${esc(article.url)}"
                                class="read-button"
                            >
                                Basahin
                            </a>

                            `

                            :

                            ""

                        }


                    </div>

                `;


                grid.appendChild(card);

            }
        );

    }



    /* =================================================
       SEARCHABLE CONTENT
    ================================================= */

    function searchable(article){

        return [

            article.title,

            article.category,

            article.date,

            article.description,

            article.keywords,

            article.author,

            article.photographer,

            article.illustrator,

            article.editor,

            article.otherCredit,

            article.credits,

            article.content

        ]

        .filter(Boolean)

        .join(" ")

        .toLocaleLowerCase("fil");

    }



    /* =================================================
       INITIAL DISPLAY
    ================================================= */

    displayArticles(
        articles
    );



    /* =================================================
       LIVE SEARCH
    ================================================= */

    input.addEventListener(
        "input",
        function(){

            const q =
                input.value
                    .toLocaleLowerCase("fil")
                    .trim();


            /* =========================================
               EMPTY SEARCH
            ========================================= */

            if(!q){

                resultsBox.innerHTML = "";


                resultsBox
                    .classList
                    .remove("show");


                info.textContent =
                    "I-type ang kahit bahagi ng salita.";


                displayArticles(
                    articles
                );


                return;

            }



            /* =========================================
               FIND ARTICLES
            ========================================= */

            const found =
                articles.filter(
                    function(article){

                        return searchable(
                            article
                        ).includes(q);

                    }
                );



            /* =========================================
               RESULT COUNT
            ========================================= */

            info.textContent =
                found.length +
                (
                    found.length === 1
                    ? " resulta"
                    : " resulta"
                ) +
                ' para sa "' +
                input.value.trim() +
                '"';



            /* =========================================
               CLEAR RESULTS
            ========================================= */

            resultsBox.innerHTML = "";


            resultsBox
                .classList
                .add("show");



            /* =========================================
               NO RESULT
            ========================================= */

            if(!found.length){

                resultsBox.innerHTML = `

                    <div class="empty">

                        <h3>
                            Walang nahanap.
                        </h3>

                        <p style="margin-top:10px;">

                            Walang artikulong tumutugma
                            sa
                            <strong>
                                "${esc(
                                    input.value.trim()
                                )}"
                            </strong>.

                        </p>

                    </div>

                `;


                displayArticles([]);


                return;

            }



            /* =========================================
               RESULT TITLE
            ========================================= */

            const heading =
                document.createElement(
                    "h3"
                );


            heading.textContent =
                "Mga Nahanap na Artikulo";


            resultsBox.appendChild(
                heading
            );



            /* =========================================
               RESULT CARDS
            ========================================= */

            found.forEach(
                function(article){

                    const result =
                        document.createElement(
                            "div"
                        );


                    result.className =
                        "search-result-card";


                    result.innerHTML = `

                        <h4>
                            ${esc(
                                article.title
                            )}
                        </h4>


                        <small>

                            ${esc(
                                article.category || ""
                            )}

                            ${
                                article.category &&
                                article.date
                                ? " • "
                                : ""
                            }

                            ${esc(
                                article.date || ""
                            )}

                        </small>


                        <p>

                            ${esc(
                                article.description || ""
                            )}

                        </p>

                    `;


                    result.addEventListener(
                        "click",
                        function(){

                            if(article.url){

                                window.location.href =
                                    article.url;

                            }

                        }
                    );


                    resultsBox.appendChild(
                        result
                    );

                }
            );



            /* =========================================
               DISPLAY MATCHING ARTICLES
            ========================================= */

            displayArticles(
                found
            );

        }
    );


})();

</script>


</body>

</html>
