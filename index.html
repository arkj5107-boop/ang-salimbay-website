/* =====================================================
   GENERAL
===================================================== */

/* =====================================================
   LOADING SCREEN
===================================================== */

#loadingScreen{

    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    background:#ffffff;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    overflow:hidden;

    z-index:99999;

    opacity:1;
    visibility:visible;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#loadingScreen.hide{

    opacity:0;
    visibility:hidden;
    pointer-events:none;
}


/* =====================================================
   SCHOOL SCENE
===================================================== */

.school-scene{

    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#ffffff;
}


/* =====================================================
   SUN GLOW
===================================================== */

.sun-glow{

    position:absolute;

    left:50%;
    top:25%;

    width:250px;
    height:250px;

    transform:
        translate(-50%,-50%)
        scale(.5);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(251,189,25,.38) 0%,
            rgba(251,189,25,.18) 35%,
            rgba(251,189,25,0) 70%
        );

    opacity:0;

    animation:
        sunGlowAppear 1.5s ease .1s forwards,
        sunGlowPulse 3s ease-in-out 1.6s infinite;
}

@keyframes sunGlowAppear{

    from{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.5);
    }

    to{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1);
    }
}

@keyframes sunGlowPulse{

    0%,100%{
        transform:
            translate(-50%,-50%)
            scale(1);
        opacity:.65;
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.12);
        opacity:.95;
    }
}


/* =====================================================
   SUN
===================================================== */

.sun{

    position:absolute;

    width:120px;
    height:120px;

    left:50%;
    top:25%;

    transform:
        translate(-50%,-50%)
        scale(.45);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 35%,
            #ffe88a 0%,
            #fbbd19 48%,
            #f39b00 100%
        );

    box-shadow:
        0 0 25px rgba(251,189,25,.65),
        0 0 55px rgba(251,189,25,.35);

    opacity:0;

    z-index:2;

    animation:
        sunRise 1.2s cubic-bezier(.2,.8,.2,1) .25s forwards,
        sunPulse 3s ease-in-out 1.5s infinite;
}

@keyframes sunRise{

    0%{
        transform:
            translate(-50%,-50%)
            scale(.45);

        opacity:0;
    }

    70%{
        transform:
            translate(-50%,-50%)
            scale(1.08);

        opacity:1;
    }

    100%{
        transform:
            translate(-50%,-50%)
            scale(1);

        opacity:1;
    }
}

@keyframes sunPulse{

    0%,100%{
        box-shadow:
            0 0 25px rgba(251,189,25,.65),
            0 0 55px rgba(251,189,25,.35);
    }

    50%{
        box-shadow:
            0 0 35px rgba(251,189,25,.85),
            0 0 80px rgba(251,189,25,.45);
    }
}


/* =====================================================
   SUN RAYS
===================================================== */

.sun-rays{

    position:absolute;

    left:50%;
    top:25%;

    width:290px;
    height:290px;

    transform:
        translate(-50%,-50%)
        rotate(0deg)
        scale(.55);

    opacity:0;

    z-index:1;

    animation:
        raysAppear 1.2s ease .35s forwards,
        raysRotate 14s linear 1.5s infinite;
}


/* INDIVIDUAL RAYS */

.sun-rays span{

    position:absolute;

    left:50%;
    top:50%;

    width:9px;
    height:42px;

    margin-left:-4.5px;
    margin-top:-21px;

    background:
        linear-gradient(
            to bottom,
            rgba(251,189,25,.25),
            #fbbd19,
            rgba(251,189,25,.25)
        );

    border-radius:20px;

    transform-origin:center 145px;

    box-shadow:
        0 0 8px rgba(251,189,25,.35);

    opacity:0;

    animation:
        rayAppear .7s ease forwards,
        rayPulse 2s ease-in-out infinite;
}


/* RAY POSITIONS */

.sun-rays span:nth-child(1){
    transform:rotate(0deg);
    animation-delay:.45s,.1s;
}

.sun-rays span:nth-child(2){
    transform:rotate(30deg);
    animation-delay:.52s,.35s;
}

.sun-rays span:nth-child(3){
    transform:rotate(60deg);
    animation-delay:.59s,.6s;
}

.sun-rays span:nth-child(4){
    transform:rotate(90deg);
    animation-delay:.66s,.85s;
}

.sun-rays span:nth-child(5){
    transform:rotate(120deg);
    animation-delay:.73s,1.1s;
}

.sun-rays span:nth-child(6){
    transform:rotate(150deg);
    animation-delay:.80s,1.35s;
}

.sun-rays span:nth-child(7){
    transform:rotate(180deg);
    animation-delay:.87s,1.6s;
}

.sun-rays span:nth-child(8){
    transform:rotate(210deg);
    animation-delay:.94s,1.85s;
}

.sun-rays span:nth-child(9){
    transform:rotate(240deg);
    animation-delay:1.01s,2.1s;
}

.sun-rays span:nth-child(10){
    transform:rotate(270deg);
    animation-delay:1.08s,2.35s;
}

.sun-rays span:nth-child(11){
    transform:rotate(300deg);
    animation-delay:1.15s,2.6s;
}

.sun-rays span:nth-child(12){
    transform:rotate(330deg);
    animation-delay:1.22s,2.85s;
}


@keyframes raysAppear{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            rotate(0deg)
            scale(.55);
    }

    100%{
        opacity:1;

        transform:

            rotate(0deg)
            scale(1);
    }
}

@keyframes raysRotate{

    from{

            rotate(0deg)

    to{

/* =====================================================
   LOADING SCREEN
===================================================== */

(function(){

    const loadingScreen =
        document.getElementById("loadingScreen");


    /*
       IMPORTANT:

       Hindi na window.load ang gamit.

       Kapag may external image na mabagal,
       hindi nito haharangin ang loading screen.
    */

    function hideLoadingScreen(){

        if(!loadingScreen){
            return;
        }

        loadingScreen.classList.add("hide");

    }


    /*
       Main timer.

       3.2 seconds ang animation.
       Sapat ito para makita ang sun,
       rays, colors, book, torch at logo.
    */

    document.addEventListener(
        "DOMContentLoaded",
        function(){

            setTimeout(
                hideLoadingScreen,
                3200
            );

        }
    );


    /*
       FAILSAFE

       Kahit magkaroon ng problema sa ibang
       resource/script, hindi mananatiling puti
       ang screen forever.

       Pag lumampas ng 6 seconds,
       automatic na mawawala ang loader.
    */

    setTimeout(
        hideLoadingScreen,
        6000
    );

})();

/* =====================================================
   SECURITY / HTML ESCAPE
===================================================== */

function esc(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            function(m){

                return {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"

                }[m];

            }
        );

}



/* =====================================================
   IMAGE PATH HELPER
===================================================== */

function imagePath(image){

    if(!image){
        return "";
    }


    /*
       Kung complete URL na ang image,
       gamitin ito nang direkta.
    */

    if(
        image.startsWith("http://") ||
        image.startsWith("https://") ||
        image.startsWith("/")
    ){

        return image;

    }


    /*
       Kung nasa Images folder ang mga article
       pictures, automatic itong maglalagay
       ng Images/.
       
       Kaya kahit filename lang ang nasa
       articles.js, gagana pa rin.
    */

    if(
        image.startsWith("Images/") ||
        image.startsWith("images/")
    ){

        return image;

    }


    return "Images/" + image;

}



/* =====================================================
   CONTRIBUTORS
===================================================== */

function people(article){

    const p = [];


    if(article.author){

        p.push(
            "✍️ " +
            article.author
        );

    }


    if(article.photographer){

        p.push(
            "📷 " +
            article.photographer
        );

    }


    if(article.illustrator){

        p.push(
            "🎨 " +
            article.illustrator
        );

    }


    if(article.editor){

        p.push(
            "🖊️ " +
            article.editor
        );

    }


    if(article.otherCredit){

        p.push(
            "👤 " +
            article.otherCredit
        );

    }


    /*
       Sinusuportahan din nito ang
       credits field ng Pax Silica.
    */

    if(
        !p.length &&
        article.credits
    ){

        p.push(
            article.credits
        );

    }


    return p.join(" • ");

}



/* =====================================================
   DISPLAY ARTICLES
===================================================== */

function displayArticles(list){

    grid.innerHTML = "";


    /*
       Walang articles
    */

    if(
        !Array.isArray(list) ||
        !list.length
    ){

        grid.innerHTML = `

            <div class="empty">

                <h3>
                    Walang nahanap na artikulo.
                </h3>

                <p style="margin-top:10px">

                    Subukan ang ibang salita,
                    pangalan, petsa, o paksa.

                </p>

            </div>

        `;

        return;

    }


    /*
       Generate cards automatically
       mula sa articles.js.
    */

    list.forEach(
        function(article){

            const card =
                document.createElement("article");


            card.className =
                "card";


            const img =
                imagePath(article.image);


            const contributor =
                people(article);


            card.innerHTML = `

                ${
                    img

                    ?

                    `
                    <img
                        src="${esc(img)}"
                        alt="${esc(article.title)}"
                        loading="lazy"
                        onerror="this.style.display='none'"
                    >
                    `

                    :

                    ""
                }


                <div class="card-content">

                    <h3>
                        ${esc(article.title)}
                    </h3>


                    <p>
                        ${esc(article.description)}
                    </p>


                    <p class="meta">

                        ${esc(article.category)}

                        •

                        ${esc(article.date)}

                    </p>


                    ${
                        contributor

                        ?

                        `
                        <p class="meta">
                            ${esc(contributor)}
                        </p>
                        `

                        :

                        ""
                    }


                    <a
                        href="${esc(article.url || "#")}"
                    >

                        <button
                            type="button"
                        >
                            Basahin
                        </button>

                    </a>

                </div>

            `;


            grid.appendChild(card);

        }
    );

}



/* =====================================================
   SEARCHABLE CONTENT
===================================================== */

function searchable(article){

    return [

        article.title,

        article.category,

        article.date,

        article.description,

        article.keywords,

        article.author,

        article.photographer,

        article.illustrator,

        article.editor,

        article.otherCredit,

        article.credits,

        article.content

    ]

    .filter(Boolean)

    .join(" ")

    .toLocaleLowerCase("fil");

}



/* =====================================================
   INITIAL ARTICLES
===================================================== */

if(
    Array.isArray(window.articles)
){

    displayArticles(
        window.articles
    );

}



/* =====================================================
   LIVE SEARCH
===================================================== */

if(input){

    input.addEventListener(
        "input",
        function(){

            const q =
                input.value
                    .toLocaleLowerCase("fil")
                    .trim();


            /* =========================================
               EMPTY SEARCH
            ========================================= */

            if(!q){

                resultsBox.innerHTML = "";

                resultsBox
                    .classList
                    .remove("show");


                info.textContent =
                    "I-type ang kahit bahagi ng salita.";


                if(
                    Array.isArray(window.articles)
                ){

                    displayArticles(
                        window.articles
                    );

                }


                return;

            }


            /* =========================================
               SEARCH ARTICLES
            ========================================= */

            const found =
                Array.isArray(window.articles)

                ?

                window.articles.filter(
                    function(article){

                        return searchable(
                            article
                        ).includes(q);

                    }
                )

                :

                [];


            /* =========================================
               DISPLAY FILTERED ARTICLES
            ========================================= */

            displayArticles(found);


            resultsBox
                .classList
                .add("show");


            /* =========================================
               NO RESULT
            ========================================= */

            if(!found.length){

                info.textContent =
                    `Walang nahanap para sa "${input.value}".`;


                resultsBox.innerHTML = `

                    <div class="search-result-card">

                        <h4>
                            Walang nahanap na artikulo.
                        </h4>

                        <p>
                            Subukan ang ibang salita,
                            pangalan, petsa,
                            o contributor.
                        </p>

                    </div>

                `;


                return;

            }


            /* =========================================
               RESULT COUNT
            ========================================= */

            info.textContent =
                `${found.length} artikulo ang nahanap.`;


            resultsBox.innerHTML =
                "<h3>Mga Resulta ng Paghahanap</h3>";


            /* =========================================
               RESULT CARDS
            ========================================= */

            found.forEach(
                function(article){

                    const item =
                        document.createElement("div");


                    item.className =
                        "search-result-card";


                    item.innerHTML = `

                        <h4>
                            ${esc(article.title)}
                        </h4>


                        <small>

                            ${esc(article.category)}

                            •

                            ${esc(article.date)}

                            <br>

                            ${esc(people(article))}

                        </small>


                        <p>
                            ${esc(article.description)}
                        </p>

                    `;


                    item.addEventListener(
                        "click",
                        function(){

                            if(article.url){

                                window.location.href =
                                    article.url;

                            }

                        }
                    );


                    resultsBox.appendChild(item);

                }
            );

        }
    );

}



/* =====================================================
   ENTER KEY SEARCH
===================================================== */

if(input){

    input.addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                const first =
                    document.querySelector(
                        ".search-result-card"
                    );


                if(
                    first &&
                    first.onclick
                ){

                    first.click();

                }

            }

        }
    );

}



/* =====================================================
   IMAGE ERROR PROTECTION
===================================================== */

document.addEventListener(
    "error",
    function(event){

        if(
            event.target &&
            event.target.tagName === "IMG"
        ){

            event.target.style.background =
                "#eeeeee";

        }

    },
    true
);

</script>
