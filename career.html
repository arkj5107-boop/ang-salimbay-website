<!DOCTYPE html>
<html lang="tl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Career Guidance ng SIM Diamond | Ang Salimbay</title>

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
    color:#222;
}


/* =====================================================
   ANG SALIMBAY LOADING SCREEN
===================================================== */

#salimbayLoader{

    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    background:
        radial-gradient(
            circle at 50% 42%,
            #8b1630 0%,
            #6B0015 42%,
            #350009 100%
        );

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:999999;

    overflow:hidden;

    opacity:1;
    visibility:visible;

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

#salimbayLoader.hide{

    opacity:0;
    visibility:hidden;
    pointer-events:none;
}


/* =====================================================
   LOADING SCENE
===================================================== */

.loader-scene{

    position:relative;

    width:min(94vw,650px);
    height:min(94vh,700px);

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}


/* =====================================================
   OUTER CIRCLE
===================================================== */

.loader-ring{

    position:absolute;

    top:35px;
    left:50%;

    width:610px;
    height:610px;

    transform:translateX(-50%);

    border:
        3px solid
        rgba(255,255,255,.45);

    border-radius:50%;

    box-shadow:
        0 0 0 10px rgba(255,255,255,.05),
        0 0 35px rgba(255,255,255,.08);

    animation:
        ringAppear 2s ease forwards;
}

@keyframes ringAppear{

    0%{
        opacity:0;

        transform:
            translateX(-50%)
            scale(.8)
            rotate(-20deg);
    }

    100%{
        opacity:1;

        transform:
            translateX(-50%)
            scale(1)
            rotate(0);
    }
}


/* =====================================================
   GOLDEN SUN
===================================================== */

.loader-sun{

    position:absolute;

    top:65px;
    left:50%;

    width:230px;
    height:230px;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #FFE45A 0%,
            #FFD02E 42%,
            #F4A900 67%,
            rgba(244,169,0,0) 72%
        );

    filter:
        drop-shadow(
            0 0 35px
            rgba(255,200,30,.6)
        );

    animation:
        sunRise 2s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes sunRise{

    0%{
        opacity:0;

        transform:
            translateX(-50%)
            translateY(50px)
            scale(.55);
    }

    100%{
        opacity:1;

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   SUN RAYS
===================================================== */

.loader-rays{

    position:absolute;

    top:35px;
    left:50%;

    width:390px;
    height:330px;

    transform:translateX(-50%);

    animation:
        raysReveal 2.4s ease forwards;
}

.loader-rays span{

    position:absolute;

    left:50%;
    top:50%;

    width:11px;
    height:115px;

    margin-left:-5.5px;

    border-radius:20px;

    background:
        linear-gradient(
            to top,
            rgba(255,211,45,.12),
            #FFD12F
        );

    transform-origin:
        50% 100%;

    box-shadow:
        0 0 12px
        rgba(255,207,45,.35);
}


/* 12 RAYS */

.loader-rays span:nth-child(1){
    transform:translateY(-145px);
}

.loader-rays span:nth-child(2){
    transform:rotate(30deg) translateY(-145px);
}

.loader-rays span:nth-child(3){
    transform:rotate(60deg) translateY(-145px);
}

.loader-rays span:nth-child(4){
    transform:rotate(90deg) translateY(-145px);
}

.loader-rays span:nth-child(5){
    transform:rotate(120deg) translateY(-145px);
}

.loader-rays span:nth-child(6){
    transform:rotate(150deg) translateY(-145px);
}

.loader-rays span:nth-child(7){
    transform:rotate(180deg) translateY(-145px);
}

.loader-rays span:nth-child(8){
    transform:rotate(210deg) translateY(-145px);
}

.loader-rays span:nth-child(9){
    transform:rotate(240deg) translateY(-145px);
}

.loader-rays span:nth-child(10){
    transform:rotate(270deg) translateY(-145px);
}

.loader-rays span:nth-child(11){
    transform:rotate(300deg) translateY(-145px);
}

.loader-rays span:nth-child(12){
    transform:rotate(330deg) translateY(-145px);
}

@keyframes raysReveal{

    0%{
        opacity:0;

        transform:
            translateX(-50%)
            scale(.55)
            rotate(-10deg);
    }

    55%{
        opacity:1;
    }

    100%{
        opacity:.85;

        transform:
            translateX(-50%)
            scale(1)
            rotate(0);
    }
}


/* =====================================================
   GREEN LAND / MOUNTAINS
===================================================== */

.loader-land{

    position:absolute;

    top:220px;
    left:50%;

    width:560px;
    height:150px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            150deg,
            transparent 0 19%,
            #3FC52C 20% 44%,
            #55D536 45% 56%,
            #35B827 57% 100%
        );

    clip-path:
        polygon(
            0 100%,
            12% 70%,
            25% 48%,
            38% 67%,
            53% 27%,
            67% 58%,
            79% 39%,
            100% 73%,
            100% 100%
        );

    opacity:.95;

    filter:
        drop-shadow(
            0 4px 8px
            rgba(0,0,0,.12)
        );

    animation:
        landReveal 2s ease forwards;
}

@keyframes landReveal{

    0%{
        opacity:0;

        transform:
            translateX(-50%)
            translateY(35px)
            scaleX(.8);
    }

    100%{
        opacity:.95;

        transform:
            translateX(-50%)
            translateY(0)
            scaleX(1);
    }
}


/* =====================================================
   BLUE WATER
===================================================== */

.loader-water{

    position:absolute;

    top:325px;
    left:50%;

    width:620px;
    height:115px;

    transform:translateX(-50%);

    overflow:hidden;

    background:
        linear-gradient(
            to bottom,
            #23C9E8,
            #079AD4 50%,
            #0068B8
        );

    clip-path:
        polygon(
            0 18%,
            12% 8%,
            25% 18%,
            38% 7%,
            51% 18%,
            64% 8%,
            77% 19%,
            89% 9%,
            100% 18%,
            100% 100%,
            0 100%
        );

    animation:
        waterReveal 2.2s ease forwards;
}

.loader-water::before,
.loader-water::after{

    content:"";

    position:absolute;

    left:-10%;

    width:120%;
    height:35px;

    border-top:
        6px solid
        rgba(180,245,255,.65);

    border-radius:50%;

    animation:
        waterMove 2.8s ease-in-out infinite;
}

.loader-water::before{
    top:27px;
}

.loader-water::after{
    top:67px;

    animation-delay:-1.2s;

    opacity:.5;
}

@keyframes waterMove{

    0%,100%{
        transform:
            translateX(-35px)
            scaleX(.96);
    }

    50%{
        transform:
            translateX(35px)
            scaleX(1.03);
    }
}

@keyframes waterReveal{

    0%{
        opacity:0;

        transform:
            translateX(-50%)
            translateY(40px);
    }

    100%{
        opacity:1;

        transform:
            translateX(-50%)
            translateY(0);
    }
}


/* =====================================================
   BLUE + RED LOWER SECTION
===================================================== */

.loader-colors{

    position:absolute;

    top:405px;
    left:50%;

    width:570px;
    height:150px;

    transform:translateX(-50%);

    overflow:hidden;

    display:flex;

    border-radius:
        0 0 280px 280px;

    box-shadow:
        inset 0 8px 20px
        rgba(0,0,0,.12);
}

.loader-blue{

    width:50%;
    height:100%;

    background:
        linear-gradient(
            135deg,
            #0756B9,
            #006CCF,
            #003E94
        );

    animation:
        colorReveal 1.8s ease forwards;
}

.loader-red{

    width:50%;
    height:100%;

    background:
        linear-gradient(
            135deg,
            #C90029,
            #E40035,
            #A90021
        );

    animation:
        colorReveal 1.8s ease .15s forwards;
}

@keyframes colorReveal{

    0%{
        transform:scaleY(0);
        transform-origin:top;
    }

    100%{
        transform:scaleY(1);
        transform-origin:top;
    }
}


/* =====================================================
   OPEN BOOK
===================================================== */

.loader-book{

    position:absolute;

    top:365px;
    left:50%;

    width:270px;
    height:115px;

    transform:translateX(-50%);

    z-index:30;

    display:flex;

    animation:
        bookAppear 1.5s ease .8s both;
}

.book-page{

    position:relative;

    width:50%;
    height:100%;

    background:
        linear-gradient(
            160deg,
            #fff 0%,
            #f4f0e7 70%,
            #d9d0c2 100%
        );

    box-shadow:
        0 12px 18px
        rgba(0,0,0,.25);
}

.book-page.left{

    border-radius:
        85% 12% 8% 35%;

    transform:skewY(8deg);

    border-right:
        2px solid #c9bfae;
}

.book-page.right{

    border-radius:
        12% 85% 35% 8%;

    transform:skewY(-8deg);

    border-left:
        2px solid #c9bfae;
}

.loader-book::after{

    content:"";

    position:absolute;

    left:50%;
    top:8px;

    width:5px;
    height:95px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            to bottom,
            #b9aa94,
            #806e58
        );

    border-radius:50%;
}

@keyframes bookAppear{

    0%{
        opacity:0;

        transform:
            translateX(-50%)
            translateY(30px)
            scale(.8);
    }

    100%{
        opacity:1;

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   TORCH
===================================================== */

.loader-torch{

    position:absolute;

    top:390px;
    left:50%;

    width:30px;
    height:170px;

    transform:translateX(-50%);

    z-index:40;

    background:
        linear-gradient(
            90deg,
            #111,
            #333,
            #050505
        );

    border-radius:
        5px 5px 12px 12px;

    box-shadow:
        0 10px 20px
        rgba(0,0,0,.35);

    animation:
        torchAppear 1.6s ease 1s both;
}

.loader-torch::before{

    content:"";

    position:absolute;

    left:50%;
    top:-48px;

    width:48px;
    height:65px;

    transform:translateX(-50%);

    background:
        radial-gradient(
            ellipse at bottom,
            #FF3B20 0%,
            #FF8A00 45%,
            #FFD52A 65%,
            transparent 68%
        );

    filter:
        drop-shadow(
            0 0 15px
            rgba(255,150,20,.7)
        );

    animation:
        flame 1s ease-in-out infinite;
}

@keyframes flame{

    0%,100%{
        transform:
            translateX(-50%)
            scaleY(.9)
            rotate(-2deg);
    }

    50%{
        transform:
            translateX(-50%)
            scaleY(1.1)
            rotate(3deg);
    }
}

@keyframes torchAppear{

    0%{
        opacity:0;

        transform:
            translateX(-50%)
            translateY(30px)
            scale(.8);
    }

    100%{
        opacity:1;

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   ANG SALIMBAY BRANDING
===================================================== */

.salimbay-brand{

    position:absolute;

    bottom:12px;

    z-index:50;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:8px;

    animation:
        brandReveal 1.3s ease 1.7s both;
}

.salimbay-logo{

    width:min(70vw,310px);

    max-height:95px;

    object-fit:contain;

    filter:
        brightness(0)
        invert(1)
        drop-shadow(
            0 5px 12px
            rgba(0,0,0,.4)
        );
}

.salimbay-subtitle{

    color:white;

    font-size:12px;

    letter-spacing:2px;

    text-transform:uppercase;

    opacity:.9;

    text-align:center;
}

.loading-dots{

    display:flex;

    gap:6px;
}

.loading-dots span{

    width:5px;
    height:5px;

    background:white;

    border-radius:50%;

    animation:
        loadingDot 1.2s infinite ease-in-out;
}

.loading-dots span:nth-child(2){
    animation-delay:.15s;
}

.loading-dots span:nth-child(3){
    animation-delay:.3s;
}

@keyframes loadingDot{

    0%,80%,100%{
        opacity:.3;
        transform:scale(.7);
    }

    40%{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes brandReveal{

    0%{
        opacity:0;

        transform:
            translateY(20px)
            scale(.92);
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   HEADER
===================================================== */

header{

    background:#6B0015;

    color:white;

    text-align:center;

    padding:30px 20px;
}

header h1{

    font-size:42px;

    letter-spacing:3px;
}

header p{

    margin-top:10px;

    font-size:15px;
}


/* =====================================================
   NAVIGATION
===================================================== */

nav{

    background:#500010;

    display:flex;

    justify-content:center;

    flex-wrap:wrap;
}

nav a{

    color:white;

    text-decoration:none;

    padding:15px 20px;

    font-weight:bold;

    transition:.2s;
}

nav a:hover{

    background:white;

    color:#6B0015;
}


/* =====================================================
   ARTICLE
===================================================== */

.article{

    max-width:900px;

    margin:50px auto;

    padding:0 25px;
}

.article h1{

    color:#6B0015;

    font-size:42px;

    line-height:1.2;

    text-align:center;

    margin-bottom:15px;
}

.article .category{

    text-align:center;

    color:#777;

    font-size:15px;

    margin-bottom:35px;
}


/* =====================================================
   MAIN IMAGE
===================================================== */

.image-box{

    width:100%;

    height:420px;

    background:#fff5f5;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-bottom:35px;

    overflow:hidden;

    border-radius:8px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.12);
}

.image-box img{

    width:100%;

    height:100%;

    object-fit:cover;
}


/* =====================================================
   CAPTION
===================================================== */

.caption{

    text-align:center;

    color:#777;

    font-size:13px;

    margin-top:-25px;

    margin-bottom:30px;

    line-height:1.5;
}


/* =====================================================
   ARTICLE TEXT
===================================================== */

.article p{

    font-size:18px;

    line-height:1.8;

    text-align:justify;

    margin-bottom:22px;
}

.article .lead{

    font-size:20px;

    font-weight:500;
}


/* =====================================================
   HIGHLIGHT / QUOTE
===================================================== */

.highlight{

    border-left:
        7px solid #6B0015;

    background:#fff5f5;

    padding:20px 25px;

    margin:30px 0;

    color:#6B0015;

    font-size:20px;

    font-weight:bold;

    line-height:1.6;

    border-radius:
        0 8px 8px 0;
}


/* =====================================================
   AUTHOR
===================================================== */

.author{

    margin-top:35px;

    padding-top:20px;

    border-top:
        1px solid #ddd;

    color:#666;

    font-size:14px;

    text-align:right;

    line-height:1.8;
}


/* =====================================================
   FOOTER
===================================================== */

footer{

    background:#6B0015;

    color:white;

    text-align:center;

    padding:35px 20px;

    margin-top:50px;
}

footer p{

    margin:7px 0;

    line-height:1.5;
}

footer p:first-child{

    font-size:22px;

    letter-spacing:2px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    header h1{
        font-size:30px;
    }

    header{
        padding:25px 15px;
    }

    nav a{
        padding:12px 10px;
        font-size:14px;
    }

    .article{

        margin:30px auto;

        padding:0 18px;
    }

    .article h1{

        font-size:31px;
    }

    .article p{

        font-size:17px;
    }

    .article .lead{

        font-size:18px;
    }

    .image-box{

        height:280px;
    }

    .highlight{

        font-size:18px;

        padding:18px;
    }


    /* LOADER MOBILE */

    .loader-scene{

        width:100vw;

        height:100vh;
    }

    .loader-ring{

        width:430px;
        height:430px;

        top:70px;
    }

    .loader-sun{

        width:155px;
        height:155px;

        top:105px;
    }

    .loader-rays{

        width:270px;
        height:240px;

        top:75px;
    }

    .loader-rays span{

        width:8px;
        height:80px;

        margin-left:-4px;
    }

    .loader-rays span:nth-child(1),
    .loader-rays span:nth-child(2),
    .loader-rays span:nth-child(3),
    .loader-rays span:nth-child(4),
    .loader-rays span:nth-child(5),
    .loader-rays span:nth-child(6),
    .loader-rays span:nth-child(7),
    .loader-rays span:nth-child(8),
    .loader-rays span:nth-child(9),
    .loader-rays span:nth-child(10),
    .loader-rays span:nth-child(11),
    .loader-rays span:nth-child(12){

        transform:
            rotate(
                calc((var(--i) - 1) * 30deg)
            )
            translateY(-105px);
    }

    .loader-land{

        width:380px;

        height:105px;

        top:245px;
    }

    .loader-water{

        width:430px;

        height:95px;

        top:335px;
    }

    .loader-colors{

        width:390px;

        height:120px;

        top:410px;
    }

    .loader-book{

        width:220px;

        height:90px;

        top:385px;
    }

    .loader-torch{

        top:405px;

        height:135px;
    }

    .salimbay-brand{

        bottom:25px;

        width:90%;
    }

    .salimbay-logo{

        width:250px;

        max-height:75px;
    }

    .salimbay-subtitle{

        font-size:10px;

        letter-spacing:1.5px;
    }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;
    }
}

</style>

</head>

<!-- ==============================================
